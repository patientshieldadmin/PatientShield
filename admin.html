<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatientShield | Secure Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">

    <!-- Login Screen -->
    <div id="loginScreen" class="max-w-md mx-auto mt-24 bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
        <h2 class="text-2xl font-bold mb-2 text-slate-800">Admin Portal Login</h2>
        <p class="text-sm text-slate-500 mb-6">Enter your secure password to access client audit records.</p>
        
        <form id="loginForm" class="space-y-4">
            <input type="password" id="adminPassword" placeholder="Admin Password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition">Login to Dashboard</button>
        </form>

        <div class="mt-4 text-center">
            <button onclick="forgotPassword()" class="text-xs text-blue-600 hover:underline font-semibold">Forgot Password? Email it to Admin Inbox</button>
        </div>
        <p id="msg" class="text-xs text-center mt-3 text-slate-500"></p>
    </div>

    <!-- Dashboard Container -->
    <div id="dashboard" class="hidden max-w-7xl mx-auto px-6 py-10">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900">PatientShield Admin Dashboard</h1>
                <p class="text-sm text-slate-500">Manage client intakes, review AI forensic findings, and access generated dispute letters.</p>
            </div>
            <button onclick="location.reload()" class="bg-white border border-slate-300 hover:bg-slate-50 px-4 py-2 rounded-lg text-sm font-semibold text-slate-700 shadow-sm">Refresh Leads</button>
        </div>

        <div id="leadsContainer" class="space-y-6">
            <!-- Dynamic leads populated here -->
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('msg');

            btn.textContent = 'Verifying...';
            msg.textContent = '';

            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadLeads();
                } else {
                    msg.textContent = data.message || 'Incorrect password.';
                    msg.className = 'text-xs text-center mt-3 text-red-600 font-semibold';
                    btn.textContent = 'Login to Dashboard';
                }
            } catch (err) {
                msg.textContent = 'Connection error during login.';
                msg.className = 'text-xs text-center mt-3 text-red-600 font-semibold';
                btn.textContent = 'Login to Dashboard';
            }
        });

        async function forgotPassword() {
            const msg = document.getElementById('msg');
            msg.textContent = 'Sending password to admin email...';
            msg.className = 'text-xs text-center mt-3 text-blue-600 font-semibold';

            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'forgot' })
                });
                const data = await res.json();
                msg.textContent = data.message || 'Password sent!';
                msg.className = 'text-xs text-center mt-3 text-green-600 font-semibold';
            } catch (err) {
                msg.textContent = 'Failed to send recovery email.';
                msg.className = 'text-xs text-center mt-3 text-red-600 font-semibold';
            }
        }

        async function loadLeads() {
            const container = document.getElementById('leadsContainer');
            container.innerHTML = `<p class="text-center text-slate-500 py-10">Loading secure client records...</p>`;

            try {
                const response = await fetch('/api/get-leads');
                const data = await response.json();

                if (data.status === 'success' && data.leads.length > 0) {
                    container.innerHTML = data.leads.map(lead => `
                        <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-6 space-y-4">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-100 pb-4 gap-2">
                                <div>
                                    <h3 class="text-xl font-bold text-slate-800">${lead.fullName}</h3>
                                    <p class="text-sm text-slate-500">Hospital: <strong class="text-blue-600">${lead.hospitalName}</strong> | Email: ${lead.clientEmail} | Phone: ${lead.phone}</p>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs text-slate-400 block">Extracted Bill Total</span>
                                    <span class="text-lg font-extrabold text-red-600">${lead.extractedBillAmount}</span>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm bg-slate-50 p-4 rounded-xl">
                                <div>
                                    <p class="font-semibold text-slate-700 mb-1">Uploaded Documents:</p>
                                    <p class="text-slate-600">• Itemized Bill: ${lead.fileName}</p>
                                    <p class="text-slate-600">• EOB: ${lead.eobName}</p>
                                    <p class="text-slate-600">• Medical Records: ${lead.recordsName}</p>
                                </div>
                                <div>
                                    <p class="font-semibold text-slate-700 mb-1">AI Forensic Findings:</p>
                                    ${lead.analysisFindings && lead.analysisFindings.length > 0 ? lead.analysisFindings.map(f => `<p class="text-slate-600 text-xs">• <strong>${f.category}:</strong> ${f.description}</p>`).join('') : '<p class="text-slate-500 text-xs">Pending clinical review.</p>'}
                                </div>
                            </div>

                            <div>
                                <h4 class="font-bold text-sm text-slate-700 mb-2">Generated Hospital Dispute Letter Draft:</h4>
                                <div class="bg-slate-900 text-slate-100 p-4 rounded-xl text-xs font-mono whitespace-pre-wrap max-h-60 overflow-y-auto">${lead.disputeLetterDraft}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `<div class="bg-white rounded-xl p-8 text-center border border-slate-200 text-slate-500">No client audit records found yet. Run a test submission on your main site to populate the dashboard.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="bg-red-50 text-red-700 rounded-xl p-6 text-center border border-red-200">Error loading leads from database.</div>`;
            }
        }
    </script>
</body>
</html>
