<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArguBill | Secure Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased">

    <!-- Login Screen -->
    <div id="loginScreen" class="max-w-md mx-auto mt-24 bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
        <h2 class="text-2xl font-bold mb-2 text-slate-800">Admin Portal Login</h2>
        <p class="text-sm text-slate-500 mb-6">Sign in with your named admin account and authenticator code.</p>

        <form id="loginForm" class="space-y-4">
            <div id="namedFields" class="space-y-4">
                <input type="text" id="adminUsername" placeholder="Username (e.g. admin@argubill.com)" autocomplete="username" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>
            <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
            <div id="codeRow" style="display: none;">
                <input type="text" id="adminCode" placeholder="6-digit authenticator code (or recovery code)" inputmode="numeric" autocomplete="one-time-code" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition cursor-pointer">Login to Dashboard</button>
        </form>
        <div class="mt-4 text-center">
            <button type="button" onclick="forgotPassword()" class="text-xs text-blue-600 hover:underline font-semibold cursor-pointer">Forgot Password?</button>
        </div>
        <p id="msg" class="text-xs text-center mt-3 text-slate-500"></p>
    </div>

    <!-- Dashboard Container (Guaranteed hidden by default via inline style) -->
    <div id="dashboard" style="display: none;" class="max-w-7xl mx-auto px-6 py-10">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900">ArguBill Admin Dashboard</h1>
                <p class="text-sm text-slate-500">Manage client intakes, review AI forensic findings, approve dispute letters, and dispatch emails.</p>
            </div>
            <button onclick="loadLeads()" class="bg-white border border-slate-300 hover:bg-slate-50 px-4 py-2 rounded-lg text-sm font-semibold text-slate-700 shadow-sm cursor-pointer">Refresh Leads</button>
        </div>

        <div id="leadsContainer" class="space-y-6">
            <!-- Dynamic leads populated here -->
        </div>
    </div>

    <script>
        function adminAuthHeaders() {
            return { 'Authorization': 'Bearer ' + (sessionStorage.getItem('adminPassword') || '') };
        }
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
        const password = document.getElementById('adminPassword').value;
            const username = document.getElementById('adminUsername').value.trim();
            const code = document.getElementById('adminCode').value.trim();
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('msg');

            btn.textContent = 'Verifying...';
            msg.textContent = '';

            try {
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, code: code || undefined })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    sessionStorage.setItem('adminPassword', data.token);
                    document.getElementById('loginScreen').style.display = 'none';
                    const dash = document.getElementById('dashboard');
                    dash.style.display = 'block';
                    dash.classList.remove('hidden');
                    loadLeads();
                } else {
                    if (data.codeRequired) {
                        document.getElementById('codeRow').style.display = 'block';
                        document.getElementById('adminCode').focus();
                    }
                    msg.textContent = data.message || 'Incorrect password.';
                    msg.className = 'text-xs text-center mt-3 text-red-600 font-semibold';
                    btn.textContent = 'Login to Dashboard';
                }
            } catch (err) {
                msg.textContent = 'Connection error during login.';
                msg.className = 'text-xs text-center mt-3 text-red-600 font-semibold';
                btn.textContent = 'Login to Dashboard';
            }
        });

        function forgotPassword() {
            const msg = document.getElementById('msg');
            msg.textContent = 'Enter one of your recovery codes in the code field to sign in. If you are locked out entirely, the owner can remove and re-enroll your account from a signed-in admin session.';
            msg.className = 'text-xs text-center mt-3 text-slate-600 font-semibold';
        }

function openFile(base64Data) {        
            if (!base64Data) {
                alert('No file data attached to this record.');
                return;
            }
            try {
                const arr = base64Data.split(',');
                const mime = arr[0] && arr[0].includes(':') ? arr[0].match(/:(.*?);/)[1] : 'application/pdf';
                const bstr = atob(arr[1] || arr[0]);
                let n = bstr.length;
                const u8arr = new Uint8Array(n);
                while (n--) {
                    u8arr[n] = bstr.charCodeAt(n);
                }
                const blob = new Blob([u8arr], { type: mime });
                const blobUrl = URL.createObjectURL(blob);
                window.open(blobUrl, '_blank');
            } catch (e) {
                window.open(base64Data, '_blank');
            }
        }

        const cardStatusMap = {};         function showCardStatus(leadId, msg, ok) {             cardStatusMap[leadId] = { msg: msg, ok: !!ok };             const el = document.getElementById('status-' + leadId);             if (el) { el.textContent = msg; el.className = 'text-xs font-semibold mt-1 ' + (ok ? 'text-emerald-600' : 'text-red-600'); }         }         function armConfirm(btn) {             if (!btn) return true;             if (btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.textContent = btn.dataset.label || btn.textContent; return true; }             btn.dataset.label = btn.textContent;             btn.dataset.armed = '1';             btn.textContent = 'Click again to confirm';             setTimeout(() => { if (btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.textContent = btn.dataset.label; } }, 8000);             return false;         }          async function approveLead(leadId, btn) {
            if (!armConfirm(btn)) return;
            
            try {
                const response = await fetch('/api/approve-lead', {
                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, adminAuthHeaders()),
                    body: JSON.stringify({ leadId })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    showCardStatus(leadId, 'Email approved and dispatched successfully!', true);
                    loadLeads();
                } else {
                    showCardStatus(leadId, 'Error: ' + result.message, false);
                }
            } catch (err) {
                showCardStatus(leadId, 'Connection error during approval.', false);
                console.error(err);
            }
        }

        async function recordOutcome(leadId, btn) {
            const reduced = document.getElementById('reduced-' + leadId).value;
            const ref = document.getElementById('ref-' + leadId).value.trim();
            if (reduced === '' || !ref) { showCardStatus(leadId, 'Enter the reduced balance and the written confirmation reference.', false); return; }
            if (!armConfirm(btn)) return;
            try {
                const response = await fetch('/api/record-outcome', {
                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, adminAuthHeaders()),
                    body: JSON.stringify({ leadId: leadId, reducedBalance: Number(reduced), confirmationRef: ref })
                });
                const result = await response.json();
                if (result.status === 'success') { showCardStatus(leadId, result.message, true); loadLeads(); }
                else { showCardStatus(leadId, 'Error: ' + result.message, false); }
            } catch (err) { showCardStatus(leadId, 'Connection error while recording the outcome.', false); console.error(err); }
        }
        async function retryInvoice(leadId, reduced, refEnc, btn) {
            if (!armConfirm(btn)) return;
            try {
                const response = await fetch('/api/record-outcome', {
                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, adminAuthHeaders()),
                    body: JSON.stringify({ leadId: leadId, reducedBalance: Number(reduced), confirmationRef: decodeURIComponent(refEnc) })
                });
                const result = await response.json();
                if (result.status === 'success') { showCardStatus(leadId, result.message, true); loadLeads(); }
                else { showCardStatus(leadId, 'Error: ' + result.message, false); }
            } catch (err) { showCardStatus(leadId, 'Connection error while retrying the invoice.', false); console.error(err); }
        }

        async function sendDispute(leadId, btn) {
            const email = document.getElementById('hospemail-' + leadId).value.trim();
            if (!armConfirm(btn)) return;
            try {
                const response = await fetch('/api/send-dispute', {
                    method: 'POST',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, adminAuthHeaders()),
                    body: JSON.stringify({ leadId: leadId, hospitalEmail: email || undefined })
                });
                const result = await response.json();
                if (result.status === 'success') { showCardStatus(leadId, result.message, true); loadLeads(); }
                else { showCardStatus(leadId, 'Error: ' + result.message, false); }
            } catch (err) { showCardStatus(leadId, 'Connection error while sending the dispute.', false); console.error(err); }
        }

        async function loadLeads() {
            const container = document.getElementById('leadsContainer');
            container.innerHTML = `<p class="text-center text-slate-500 py-10">Loading secure client records...</p>`;

            try {
                const response = await fetch('/api/get-leads', { headers: adminAuthHeaders() });
                const data = await response.json();

                if (!response.ok || data.status !== 'success') {
                    container.innerHTML = `<div class="bg-red-50 text-red-700 rounded-xl p-6 text-center border border-red-200">${data.message || 'Error loading leads from database.'}</div>`;
                    return;
                }

                if (data.status === 'success' && data.leads.length > 0) {
                    container.innerHTML = data.leads.map(lead => {
                        const isApproved = lead.approvalStatus === 'approved_and_sent';
                        const emailContent = lead.preparedEmailContent || {};

                        return `
                            <div class="bg-white rounded-2xl shadow-md border border-slate-200 p-6 space-y-4">
                                <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-100 pb-4 gap-4">
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <h3 class="text-xl font-bold text-slate-800">${lead.fullName}</h3>
                                            <span class="text-xs px-2.5 py-1 rounded-full font-bold ${isApproved ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                                ${isApproved ? '✓ Email Sent' : '⏳ Pending Admin Approval'}
                                            </span>
                                        </div>
                                        <p class="text-sm text-slate-500">Hospital: <strong class="text-blue-600">${lead.hospitalName}</strong> | Email: ${lead.clientEmail} | Phone: ${lead.phone}</p>
                                        <p class="text-xs text-slate-400 mt-1">📅 Submitted: ${lead.submittedAt ? new Date(lead.submittedAt).toLocaleString() : 'N/A'}</p>
                                    </div>
                                    <div class="flex gap-4 items-center">
                                        <div class="text-right">
                                            <span class="text-xs text-slate-400 block font-medium">Extracted Bill Total</span>
                                            <span class="text-lg font-extrabold text-slate-900">${lead.extractedBillAmount || '$0'}</span>
                                        </div>
                                        <div class="text-right bg-emerald-50 px-4 py-2 rounded-xl border border-emerald-200">
                                            <span class="text-xs text-emerald-700 block font-semibold">Potential Savings</span>
                                            <span class="text-lg font-black text-emerald-600">${lead.estimatedSavings || '$0.00'}</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm bg-slate-50 p-4 rounded-xl">
                                    <div>
                                        <p class="font-semibold text-slate-700 mb-1">Uploaded Documents & Requests:</p>
                                        <p class="text-slate-600 flex items-center justify-between gap-2 mb-2">
                                            <span>• Bill: ${lead.fileName}</span>
                                            ${lead.fileData ? `<button onclick="openFile('${lead.fileData}')" class="bg-blue-600 text-white text-xs px-3 py-1 rounded-lg hover:bg-blue-700 font-semibold cursor-pointer shadow-sm">View File</button>` : ''}
                                        </p>
                                        <p class="text-slate-600">• EOB: ${lead.eobName}</p>
                                        <p class="text-slate-600 mb-3">• Records: ${lead.recordsName}</p>
                                        
                                        ${lead.missingInfoRequests && lead.missingInfoRequests.length > 0 ? `
                                            <div class="bg-amber-50 border-l-4 border-amber-500 p-2.5 text-xs text-amber-900 rounded-lg">
                                                <p class="font-bold mb-1">⚠️ Missing Information Requested from Client:</p>
                                                <ul class="list-disc pl-4 space-y-0.5">
                                                    ${lead.missingInfoRequests.map(req => `<li>${req}</li>`).join('')}
                                                </ul>
                                            </div>
                                        ` : ''}
                                    </div>
                                    <div>
                                        <p class="font-semibold text-slate-700 mb-1">AI Forensic Findings & Discrepancies:</p>
                                        ${lead.analysisFindings && lead.analysisFindings.length > 0 ? lead.analysisFindings.map(f => `<p class="text-slate-600 text-xs mb-1.5">• <strong>${f.category}:</strong> ${f.description}</p>`).join('') : '<p class="text-slate-500 text-xs italic">No verified billing discrepancies or duplicate entries identified yet.</p>'}
                                    </div>
                                </div>

                                <div>
                                    <h4 class="font-bold text-sm text-slate-700 mb-2">Generated Hospital Dispute Letter Draft (with Verification References):</h4>
                                    <div class="bg-slate-900 text-slate-100 p-4 rounded-xl text-xs font-mono whitespace-pre-wrap max-h-60 overflow-y-auto">${lead.disputeLetterDraft || 'Draft pending.'}</div>
                                </div>

                                <div class="border-t border-slate-100 pt-4">
                                    <p class="font-semibold text-slate-700 text-sm mb-1">Case Pipeline</p> <p id="status-${lead.id}" class="text-xs font-semibold mt-1 ${cardStatusMap[lead.id] ? (cardStatusMap[lead.id].ok ? 'text-emerald-600' : 'text-red-600') : ''}">${cardStatusMap[lead.id] ? cardStatusMap[lead.id].msg : ''}</p>
                                    <p class="text-xs text-slate-600">State: <strong>${lead.caseState || 'legacy (pre-pipeline)'}</strong>${lead.agreement ? ' · Agreement: ✓ v' + lead.agreement.version + ' (' + new Date(lead.agreement.acceptedAt).toLocaleString() + ')' : ' · Agreement: ✗ none on file'}${lead.hipaaAuthorization ? ' · HIPAA Authorization: ✓ v' + lead.hipaaAuthorization.version + ' (' + new Date(lead.hipaaAuthorization.acceptedAt).toLocaleString() + ')' : ' · HIPAA Authorization: ✗ none on file'}${lead.accessDirective ? ' · Access Directive: ✓ v' + lead.accessDirective.version + ' (' + new Date(lead.accessDirective.acceptedAt).toLocaleString() + ')' : ' · Access Directive: ✗ none on file'}${lead.hospitalBillingEmail ? ' · Hospital billing email: ' + lead.hospitalBillingEmail : ''}</p>
                                    ${lead.disputeSentAt ? `<p class="text-xs text-emerald-600 font-semibold mt-1">✓ Dispute sent ${new Date(lead.disputeSentAt).toLocaleString()} to ${lead.disputeSentTo} (${lead.disputeChannel})</p>` : ''}
                                    ${lead.outcome ? `<p class="text-xs text-slate-700 mt-1">Outcome: <strong>${lead.outcome.result}</strong> — $${lead.outcome.originalBalance} → $${lead.outcome.reducedBalance} · Verified savings $${lead.outcome.verifiedSavings} · Fee $${lead.outcome.fee} · Ref: ${lead.outcome.confirmationRef}${lead.feeInvoice ? ' · Invoice: ' + lead.feeInvoice.invoiceStatus + (lead.feeInvoice.hostedInvoiceUrl ? ' (' + lead.feeInvoice.hostedInvoiceUrl + ')' : '') : ''}</p>${lead.feeInvoice && lead.feeInvoice.invoiceStatus === 'stripe_error' ? `<div class="mt-2"><button onclick="retryInvoice('${lead.id}', ${lead.outcome.reducedBalance}, '${encodeURIComponent(lead.outcome.confirmationRef)}', this)" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition cursor-pointer">Retry Fee Invoice</button></div>` : ''}` : `
                                    <div class="grid md:grid-cols-2 gap-3 mt-3">
                                        <div class="flex flex-col gap-2">
                                            <input type="email" id="hospemail-${lead.id}" placeholder="Hospital billing email" value="${lead.hospitalBillingEmail || ''}" class="border border-slate-300 rounded-lg px-3 py-2 text-xs">
                                            <button onclick="sendDispute('${lead.id}', this)" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition cursor-pointer">Send Dispute Packet to Hospital</button>
                                        </div>
                                        <div class="flex flex-col gap-2">
                                            <input type="number" step="0.01" min="0" id="reduced-${lead.id}" placeholder="Reduced balance (from written confirmation)" class="border border-slate-300 rounded-lg px-3 py-2 text-xs">
                                            <input type="text" id="ref-${lead.id}" placeholder="Confirmation reference (e.g. corrected statement date)" class="border border-slate-300 rounded-lg px-3 py-2 text-xs">
                                            <button onclick="recordOutcome('${lead.id}', this)" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-4 py-2 rounded-xl text-xs shadow transition cursor-pointer">Record Outcome & Invoice Fee</button>
                                        </div>
                                    </div>`}
                                </div>

                                <div class="border-t border-slate-100 pt-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div class="text-xs text-slate-600">
                                        <p class="font-semibold text-slate-700 mb-1">Prepared Client Email Status:</p>
                                        <p><strong>Subject:</strong> ${emailContent.subject || 'N/A'}</p>
                                        <p><strong>Recipient:</strong> ${emailContent.recipient || lead.clientEmail}</p>
                                        ${isApproved ? `<p class="text-emerald-600 font-semibold mt-1">✓ Dispatched at: ${new Date(lead.emailSentAt).toLocaleString()}</p>` : ''}
                                    </div>
                                    <div>
                                        ${isApproved 
                                            ? `<span class="bg-slate-100 text-slate-500 font-bold px-4 py-2 rounded-xl text-xs border border-slate-200 block">Email Already Sent</span>`
                                            : `<button onclick="approveLead('${lead.id}', this)" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm shadow-md transition cursor-pointer">Approve & Send Email to Client</button>`
                                        }
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = `<div class="bg-white rounded-xl p-8 text-center border border-slate-200 text-slate-500">No client audit records found yet.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="bg-red-50 text-red-700 rounded-xl p-6 text-center border border-red-200">Error loading leads from database.</div>`;
            }
        }
    </script>
</body>
</html>
