  <script>
    document.getElementById('intakeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitButton = document.getElementById('submitBtn');
      submitButton.disabled = true;
      submitButton.innerText = 'Analyzing Bill & Uploading...';

      try {
        const formData = new FormData(this);
        const fileInput = document.querySelector('input[type="file"]');
        
        let extractedText = '';
        if (fileInput && fileInput.files[0]) {
          const file = fileInput.files[0];
          extractedText = await file.text().catch(() => ''); 
        }

        const payload = {
          fullName: formData.get('fullName'),
          email: formData.get('email'),
          phoneNumber: formData.get('phoneNumber'),
          hospitalName: formData.get('hospitalName'),
          billAmount: formData.get('billAmount'),
          documentText: extractedText,
          fileName: fileInput && fileInput.files[0] ? fileInput.files[0].name : null
        };

        const response = await fetch('/api/submit-intake', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload),
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || result.message || 'Submission failed on server.');
        }

        alert('Audit Pipeline Initiated Successfully! Check your email.');
        window.location.reload();

      } catch (error) {
        console.error('Submission Error:', error);
        alert('Submission error: ' + error.message);
        submitButton.disabled = false;
        submitButton.innerText = 'Submit For Free Forensic Audit';
      }
    });
  </script>
</body>
</html>
