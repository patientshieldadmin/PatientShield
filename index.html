<script>
    document.getElementById('auditForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing Secure Audit...';
        statusMessage.textContent = '';

        // Gather form fields safely
        const clientName = document.getElementById('clientName')?.value || '';
        const clientEmail = document.getElementById('clientEmail')?.value || '';
        const hospitalName = document.getElementById('hospitalName')?.value || '';
        
        // Grab the primary itemized bill file input
        const fileInput = document.getElementById('documentFile') || document.querySelector('input[type="file"]');
        
        if (!fileInput || !fileInput.files[0]) {
            alert('Please select a file to upload.');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit For Forensic Audit';
            return;
        }

        const reader = new FileReader();
        reader.onload = async function(event) {
            const documentText = event.target.result;

            try {
                const response = await fetch('/api/submit-intake', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clientName, clientEmail, hospitalName, documentText })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Success! Document verified and audit pipeline initiated.');
                    document.getElementById('auditForm').reset();
                } else {
                    throw new Error(data.error || 'Failed to process intake.');
                }
            } catch (error) {
                alert('Network error during submission: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit For Forensic Audit';
            }
        };

        reader.readAsDataURL(fileInput.files[0]);
    });
</script>
