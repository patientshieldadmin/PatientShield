<script>
    document.getElementById('auditForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'Analyzing Bill & Uploading...';
        statusMessage.textContent = '';

        const clientName = document.getElementById('clientName').value;
        const clientEmail = document.getElementById('clientEmail').value;
        const hospitalName = document.getElementById('hospitalName').value;
        const fileInput = document.getElementById('documentFile').files[0];

        if (!fileInput) {
            statusMessage.textContent = 'Please select a file to upload.';
            statusMessage.style.color = '#dc2626';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit For Forensic Audit';
            return;
        }

        const reader = new FileReader();
        
        // Use readAsDataURL for PDFs/images to safely transmit binary files without breaking JSON parsing
        reader.onload = async function(event) {
            const documentText = event.target.result;

            try {
                const response = await fetch('/api/submit-intake', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clientName, clientEmail, hospitalName, documentText })
                });

                const data = await response.json();

                if (response.ok) {
                    statusMessage.style.color = '#16a34a';
                    statusMessage.textContent = 'Success! Document verified and audit pipeline initiated.';
                    document.getElementById('auditForm').reset();
                } else {
                    throw new Error(data.error || 'Failed to process intake.');
                }
            } catch (error) {
                statusMessage.style.color = '#dc2626';
                statusMessage.textContent = 'Error: ' + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit For Forensic Audit';
            }
        };

        reader.onerror = function() {
            statusMessage.style.color = '#dc2626';
            statusMessage.textContent = 'Error reading the uploaded file.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit For Forensic Audit';
        };

        // Read file as Data URL to support PDFs and images cleanly
        reader.readAsDataURL(fileInput);
    });
</script>
