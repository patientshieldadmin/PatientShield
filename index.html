<script>
    document.getElementById('auditForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Processing Secure Audit...";
        btn.disabled = true;

        const fileInput = document.getElementById('itemizedBill');
        const file = fileInput.files[0];

        if (!file) {
            alert('Please upload an itemized hospital bill.');
            btn.innerText = "Submit For Free Forensic Audit";
            btn.disabled = false;
            return;
        }

        const reader = new FileReader();
        reader.onerror = function() {
            alert('Error reading the uploaded file.');
            btn.innerText = "Submit For Free Forensic Audit";
            btn.disabled = false;
        };

        reader.onload = async function(event) {
            const formData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                hospitalName: document.getElementById('hospitalName').value,
                billAmount: document.getElementById('billAmount').value,
                fileName: file.name,
                fileData: event.target.result
            };

            try {
                const response = await fetch('/api/submit-intake', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                let result = {};
                try {
                    result = await response.json();
                } catch (parseErr) {
                    console.warn('Non-JSON response received');
                }
                
                if (response.ok) {
                    document.getElementById('auditForm').style.display = 'none';
                    document.getElementById('successMessage').classList.remove('hidden');
                } else {
                    alert(result.message || "Error processing submission. Please try again.");
                    btn.innerText = "Submit For Free Forensic Audit";
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Network error during submission. Please check your connection.");
                btn.innerText = "Submit For Free Forensic Audit";
                btn.disabled = false;
            }
        };

        reader.readAsDataURL(file);
    });
</script>
